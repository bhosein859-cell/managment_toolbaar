name: Release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test --concurrency=1
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: python -m unittest discover -s tool/tests -v
      - run: dart run tool/update_calculator_table.dart --check
      - run: python -m pip install -r tool/requirements-branding.txt
      - run: python tool/generate_branding.py --check
  android-unsigned-compile:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile UNSIGNED APK and AAB (not installable releases)
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-UNSIGNED-compile-validation-only
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
  windows-release:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - run: python tool/package_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-COMPLETE-unsigned-bundle
          path: |
            releases/management_toolbox-windows-x64.zip
            releases/management_toolbox-windows-x64.zip.sha256
          if-no-files-found: error
# Supplied, NOT executed here. No signing secrets, deployment or publication.
# Actions pinned to tag SHAs resolved with git ls-remote during stage20; review updates before production use.
