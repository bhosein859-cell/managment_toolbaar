name: Arena artifact transfer (temporary)

# پل موقت میان CI و میزبان امضا. خروجی‌های build در artifact معمولی Actions روی یک
# storage ثالث می‌نشینند و از این محیط قابل دریافت نیستند، پس این workflow آن‌ها را روی
# شاخهٔ موقت arena/artifacts-inbox می‌گذارد. امضا بیرون از CI انجام می‌شود و job دوم با
# apksigner و aapt2 رسمی Android SDK همان فایل‌ها را راستی‌آزمایی می‌کند.
# این فایل پس از تحویل حذف می‌شود؛ بیلدها و خروجی‌ها commit دائمی نمی‌شوند.
on:
  workflow_dispatch: {}
  push:
    branches: ['arena/**']

permissions:
  contents: write
  actions: read

concurrency:
  group: inbox-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_RUN_ID: '39029028069'
  GH_TOKEN: ${{ github.token }}

jobs:
  ship:
    name: Copy build artifacts to inbox branch
    if: github.ref_name != 'arena/artifacts-inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Download artifacts of the build run
        run: |
          set -euo pipefail
          mkdir -p inbox
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts" \
            --jq '.artifacts[] | "\(.id) \(.name)"' > /tmp/artifacts.txt
          cat /tmp/artifacts.txt
          while read -r id name; do
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
              -o "/tmp/$name.zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"
            test -s "/tmp/$name.zip"
            unzip -o -q "/tmp/$name.zip" -d inbox
            rm -f "/tmp/$name.zip"
          done < /tmp/artifacts.txt
          (cd inbox && sha256sum * > /tmp/hashes.txt)
          {
            echo "source_build_run=$BUILD_RUN_ID"
            echo "transfer_run=$GITHUB_RUN_ID"
            echo "trigger_commit=$(git rev-parse HEAD)"
            cat /tmp/hashes.txt
          } > inbox/PROVENANCE.txt
          ls -l inbox
      - name: Push inbox branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q --orphan arena/artifacts-inbox
          git rm -q -r --cached . >/dev/null
          git add -f inbox
          git commit -q -m "inbox: build run $BUILD_RUN_ID (UNSIGNED, awaiting local signing)"
          git push -q -f origin arena/artifacts-inbox
          echo "arena/artifacts-inbox updated"

  verify:
    name: Verify inbox binaries with official Android tools
    if: github.ref_name == 'arena/artifacts-inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: arena/artifacts-inbox
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate build-tools
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$bt" >> "$GITHUB_ENV"
          echo "build-tools: $bt"
          "$BT/apksigner" --version 2>/dev/null | head -1 || true
      - name: Windows portable bundle listing
        run: |
          set -euo pipefail
          for z in inbox/*.zip; do
            echo "===== $z"
            unzip -l "$z" | tail -n 8
            unzip -t "$z" | tail -n 2
            python3 -c "import zipfile,sys; zf=zipfile.ZipFile(sys.argv[1]); d=[n for n in zf.namelist() if '/data/' in n or n.endswith(('.dll','.exe'))]; print(' native+data entries:', len(d)); print(' sqlite dll:', [n for n in d if 'sqlite' in n.lower()]); print(' exe:', [n for n in d if n.endswith('.exe')])" "$z"
          done
      - name: aapt2 badging and apksigner verify
        run: |
          set -uo pipefail
          : > /tmp/results.txt
          for apk in inbox/*.apk; do
            echo "===== $apk"
            "$BT/aapt2" dump badging "$apk" \
              | grep -E '^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable-activity)' \
              | head -10
            "$BT/apksigner" verify --verbose --print-certs "$apk" 2>&1 | head -22
            code=${PIPESTATUS[0]}
            echo "$(basename "$apk") verify_exit=$code" | tee -a /tmp/results.txt
          done
      - name: AAB check and gate
        run: |
          set -euo pipefail
          for a in inbox/*.aab; do
            echo "===== $a"
            python3 -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); n=z.namelist(); print(' entries', len(n), 'CRC test:', z.testzip()); print(' abis', sorted({x.split('/')[2] for x in n if x.startswith('base/lib/')})); print(' flutter_assets files:', sum(1 for x in n if 'flutter_assets' in x)); print(' resources.arsc:', [x for x in n if x.endswith('resources.arsc')])" "$a"
          done
          cat /tmp/results.txt
          if [ -f inbox/SIGNED ]; then
            if grep -qv 'verify_exit=0$' /tmp/results.txt; then
              echo 'signed APK failed apksigner verification'
              exit 1
            fi
            echo 'GATE: every APK verified by apksigner'
          else
            echo 'GATE: skipped (inbox binaries are UNSIGNED by design at this stage)'
          fi
